<style id="loaderStyle">
  html {
    height: 100%;
  }
  ._loader {
    z-index: 100;
    width: 100%;
    height: 100%;
    position: fixed;
    background-color: #131b23;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  ::-webkit-scrollbar {
    display: none;
  }
</style>
<div class="_loader" id="_loader">
  <video width="320" height="240" autoplay loop playsinline muted>
    <source src="/images/logo_loading.webm" type="video/webm" />
    Your browser does not support the video tag.
  </video>
</div>
<noscript>
  <style>
    ._loader {
      display: none;
    }
  </style>
</noscript>
